---
# group_vars for truenas host
# All connection variables are in roles/truenas/defaults/main.yml
# Override here if needed (e.g., different API URL)

# NFS shares
truenas_nfs_shares:
  - dataset: "wayreth/data/media"
    comment: "Plex media library"
    hosts:
      - "192.168.220.7" # tika (storage network)
      - "192.168.220.8" # bupu (storage network)
      - "192.168.220.9" # sturm (storage network)
      - "192.168.220.10" # kaz (storage network, Calibre-Web)
      - "192.168.220.12" # plex (storage network)
      - "192.168.220.24" # arr (storage network)
      - "192.168.220.18" # tdarr-node (storage network)
    maproot_user: "root"
    maproot_group: "wheel"
  # Proxmox VM/backup storage (datastore_id proxmox-nfs in terraform/storage.tf).
  # Pre-existing on TrueNAS; codified here so the dataset + share are managed.
  - dataset: "wayreth/proxmox-nfs"
    comment: "Proxmox NFS storage"
    hosts:
      - "192.168.220.7" # tika (storage network)
      - "192.168.220.8" # bupu (storage network)
      - "192.168.220.9" # sturm (storage network)
    maproot_user: "root"
    maproot_group: "wheel"

# Periodic ZFS snapshots — recursive on wayreth/data covers media/home/public.
# Daily at 02:00, 2-week retention (cheap CoW deltas; fast accidental-delete recovery).
truenas_snapshot_tasks:
  - dataset: "wayreth/data"
    recursive: true
    lifetime_value: 2
    lifetime_unit: "WEEK"
    schedule:
      minute: "0"
      hour: "2"
      dom: "*"
      month: "*"
      dow: "*"

# ZFS scrub schedule — weekly Sunday 00:00 (already configured live; codified here).
truenas_scrub_tasks:
  - pool: "wayreth"
    threshold: 35
    schedule:
      minute: "0"
      hour: "0"
      dom: "*"
      month: "*"
      dow: "7"

# NUT/UPS monitoring — CyberPower PR1500LCDRT2U replaced the failing APC unit
# (homelab-hms). driver/port identified via `nut-scanner -U` over USB.
# shutdown=LOWBATT: TrueNAS only triggers its own shutdown sequence (and
# broadcasts FSD to Proxmox NUT slaves) once the UPS reports low battery,
# not on every switch to battery power.
truenas_ups_driver: "usbhid-ups$PR1500LCDRT2U"
truenas_ups_port: "auto"
truenas_ups_identifier: "ups"
truenas_ups_description: "CyberPower PR1500LCDRT2U"
truenas_ups_mode: "MASTER"
truenas_ups_shutdown_mode: "LOWBATT"
truenas_ups_rmonitor: true
