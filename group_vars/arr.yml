---
# NFS mount for media library
arr_nfs_server: 192.168.220.6
arr_nfs_export: /mnt/wayreth/data/media
arr_media_path: /data/media

# Timezone — update to match your local timezone
arr_timezone: America/Detroit

# Pushover notifications (for Watchtower)
arr_pushover_api_token: "{{ lookup('env', 'PUSHOVER_API_TOKEN') }}"
arr_pushover_user_key: "{{ lookup('env', 'PUSHOVER_USER_KEY') }}"

# Uptime Kuma group for arr monitors (referenced via parent_name: "arr")
autokuma_labels:
  kuma.arr.group.name: "Arr Stack"

# Pin container DNS upstreams. Docker's embedded resolver otherwise copies the
# host's /etc/resolv.conf at container start, and Tailscale on this LXC
# (installed by hand, accept-dns on) rewrites that file to 100.100.100.100
# while logged in. When the node dropped to NeedsLogin on 2026-09-16 the
# MagicDNS resolver started returning SERVFAIL and every container started
# during the logged-in window lost DNS (EAI_AGAIN in tdarr/lidarr/prowlarr).
# Matches the LXC's Terraform resolvers: the gateway (NextDNS "open" profile,
# resolves internal tlesh.xyz names) with 1.1.1.1 as fallback.
docker_daemon_options:
  dns:
    - 192.168.233.1
    - 1.1.1.1
