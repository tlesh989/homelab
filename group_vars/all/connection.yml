---
ansible_python_interpreter: auto_silent
ansible_user: ansible
ansible_ssh_private_key_file: ~/.ssh/ansible_ed25519

# users role
users_groups:
  - "{{ lookup('env', 'SSH_USER') }}"
users_list:
  - username: "{{ lookup('env', 'SSH_USER') }}"
    password: >-
      {{ lookup('env', 'SSH_USER_PASS') | password_hash('sha512', 65534 | random(seed=inventory_hostname) | string) }}
    shell: /bin/bash
    authorized_keys:
      - "{{ lookup('env', 'SSH_PUBLIC_KEY') }}"

# packages role
package_list:
  - name: curl
  - name: git
  - name: htop
  - name: iftop
  - name: iotop
  - name: lm-sensors
  - name: mc
  - name: ncdu
  - name: net-tools
  - name: nmap
  - name: openssh-server
  - name: python3
  - name: qemu-guest-agent
  - name: screen
  - name: smartmontools
  - name: sudo
  - name: tmux
  - name: tree
  - name: wget

# unifi role
# Single source: the reservation hosts in network_inventory.yml (role reads name/mac/ip).
unifi_dhcp_reservations: "{{ network_inventory.hosts | selectattr('assignment', 'equalto', 'reservation') | list }}"

unifi_port_forwards:
  # Flat creative world on .19 is LAN-only; the public forwards below go to .20.
  - name: minecraft
    proto: udp
    dst_port: "19132"
    fwd: "192.168.233.19"
    fwd_port: "19132"
    enabled: false
  # NetherNet: TLS signaling on the default port 19132 (Caddy -> BDS on 19131), then UDP
  # gameplay on the server-udp-ports range (same numbers externally and internally).
  - name: minecraft2
    proto: tcp
    dst_port: "19132"
    fwd: "192.168.233.20"
    fwd_port: "19132"
    enabled: true
  # Temporary TLS port from the first rollout; superseded by the default-port rule above.
  - name: minecraft2-tls
    proto: tcp
    dst_port: "19134"
    fwd: "192.168.233.20"
    fwd_port: "19132"
    enabled: false
  - name: minecraft2-udp
    proto: udp
    dst_port: "30000-30009"
    fwd: "192.168.233.20"
    fwd_port: "30000-30009"
    enabled: true

# geerlingguy.ntp
ntp_timezone: "America/Detroit"

# geerlingguy.security
security_ssh_port: 22
security_ssh_password_authentication: "no"
security_ssh_permit_root_login: "no"
security_ssh_usedns: "no"
security_autoupdate_enabled: true
security_fail2ban_enabled: false
security_sudoers_passwordless:
  - "{{ lookup('env', 'SSH_USER') }}"
