---
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job to detect which files changed
  changes:
    permissions:
      contents: read
      pull-requests: read  # required by dorny/paths-filter on pull_request events
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      ansible: ${{ steps.filter.outputs.ansible }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'
              - '.github/workflows/ci.yml'
            ansible:
              - 'main.yml'
              - 'roles/**'
              - 'requirements.yml'
              - 'group_vars/**'
              - 'hosts'
              - 'ansible.cfg'
              - 'scripts/ip_inventory.py'
              - 'Taskfile.yml'
              - '.github/workflows/ci.yml'

  validate-terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    env:
      # Job-level so `task ci` (terraform init) actually uses it.
      TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same versions as dev machines; mise.toml is the only pin.
      - name: Install Terraform and Task from mise.toml
        uses: jdx/mise-action@v5
        with:
          install_args: terraform task

      - name: Create Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: /home/runner/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-providers-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-providers-

      - name: Terraform Validate
        working-directory: ./terraform
        run: task ci

  validate-ansible:
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same versions as dev machines; mise.toml is the only pin. mise-action caches the installs.
      - name: Install Ansible, ansible-lint, yamllint, Python and Task from mise.toml
        uses: jdx/mise-action@v5
        with:
          install_args: python uv task pipx:ansible-core pipx:ansible-lint pipx:yamllint

      - name: Cache Ansible Galaxy Roles/Collections
        uses: actions/cache@v6
        with:
          path: |
            galaxy_roles
            galaxy_collections
          key: ${{ runner.os }}-ansible-galaxy-${{ hashFiles('requirements.yml') }}

      - name: Install Ansible Galaxy Dependencies
        run: |
          ansible-galaxy install -r requirements.yml -p galaxy_roles
          ansible-galaxy collection install -r requirements.yml -p galaxy_collections

      - name: Ansible Lint
        run: task lint

      - name: Ansible Syntax Check
        run: ansible-playbook --syntax-check main.yml

      - name: Set up script venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: IP inventory tool unit tests
        run: .venv/bin/python -m pytest tests/test_ip_inventory.py -q

      - name: IP inventory drift check
        run: task ip:check

  ci:
    if: always()
    needs: [changes, validate-terraform, validate-ansible]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs failed or were cancelled"
          exit 1
      - name: All checks passed or skipped
        run: echo "All jobs succeeded or were skipped"
