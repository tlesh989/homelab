---
- name: Remove obsolete GitHub CLI apt repository files (superseded by mise)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/github-cli.sources
    - /etc/apt/sources.list.d/github-cli.list
  become: true

- name: Remove obsolete GitHub CLI apt keyring (superseded by mise)
  ansible.builtin.file:
    path: /usr/share/keyrings/githubcli-archive-keyring.gpg
    state: absent
  become: true

- name: Remove legacy one-line apt list files superseded by deb822 sources
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/nodesource.list
    - /etc/apt/sources.list.d/doppler.list
  become: true

- name: Install curl and gpg
  ansible.builtin.apt:
    name:
      - curl
      - gpg
      - python3-debian
      - locales
    state: present
    update_cache: true
  become: true

- name: Generate en_US.UTF-8 locale
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present
  become: true

- name: Set en_US.UTF-8 as system default locale
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
    mode: "0644"
  loop:
    - { key: LANG, value: en_US.UTF-8 }
    - { key: LC_ALL, value: en_US.UTF-8 }
  loop_control:
    label: "{{ item.key }}"
  become: true

- name: Download NodeSource GPG key (ASCII-armored)
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /tmp/nodesource-repo.gpg.key
    mode: "0644"
  become: true

- name: Dearmor NodeSource GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/nodesource.gpg /tmp/nodesource-repo.gpg.key
    creates: /usr/share/keyrings/nodesource.gpg
  become: true
  changed_when: true

- name: Add NodeSource apt repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: https://deb.nodesource.com/node_20.x # nocheck
    suites: nodistro
    components: main
    signed_by: /usr/share/keyrings/nodesource.gpg
    state: present
  become: true

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
  become: true

- name: Check for legacy npm-installed Claude Code CLI
  ansible.builtin.stat:
    path: /usr/local/bin/claude
  become: true
  register: claude_code_npm_bin

- name: Remove legacy npm-installed Claude Code CLI (superseded by native installer)
  ansible.builtin.command:
    cmd: npm uninstall -g @anthropic-ai/claude-code
  become: true
  when: claude_code_npm_bin.stat.exists
  changed_when: true

- name: Install Claude Code CLI via native installer # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
    creates: /home/{{ claude_code_user }}/.local/bin/claude
    executable: /bin/bash
  become: true
  become_user: "{{ claude_code_user }}"
  changed_when: true

- name: Check for legacy npm-installed bd (beads) CLI
  ansible.builtin.stat:
    path: /usr/bin/bd
  become: true
  register: bd_npm_bin

- name: Remove legacy npm-installed bd (beads) CLI (superseded by mise)
  ansible.builtin.command:
    cmd: npm uninstall -g @beads/bd
  become: true
  when: bd_npm_bin.stat.exists
  changed_when: true

- name: Download Doppler GPG key (ASCII-armored)
  ansible.builtin.get_url:
    url: https://packages.doppler.com/public/cli/gpg.DE2A7741A397C129.key # nocheck
    dest: /tmp/doppler.gpg.key
    mode: "0644"
  become: true
  register: doppler_key_download

- name: Dearmor Doppler GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /usr/share/keyrings/doppler-archive-keyring.gpg /tmp/doppler.gpg.key
  become: true
  when: doppler_key_download.changed
  changed_when: doppler_key_download.changed # noqa: no-handler

- name: Add Doppler apt repository
  ansible.builtin.deb822_repository:
    name: doppler
    types: deb
    uris: https://packages.doppler.com/public/cli/deb/debian # nocheck
    suites: any-version
    components: main
    signed_by: /usr/share/keyrings/doppler-archive-keyring.gpg
    state: present
  become: true

- name: Install git and doppler
  ansible.builtin.apt:
    name:
      - git
      - doppler
    state: present
    update_cache: true
  become: true

- name: Download mise GPG key (ASCII-armored)
  ansible.builtin.get_url:
    url: https://mise.jdx.dev/gpg-key.pub
    dest: /tmp/mise-gpg-key.pub
    mode: "0644"
    force: true
  become: true
  register: mise_key_download

- name: Dearmor mise GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /usr/share/keyrings/mise-archive-keyring.gpg /tmp/mise-gpg-key.pub
  become: true
  when: mise_key_download.changed
  changed_when: mise_key_download.changed # noqa: no-handler

- name: Add mise apt repository
  ansible.builtin.deb822_repository:
    name: mise
    types: deb
    uris: https://mise.jdx.dev/deb # nocheck
    suites: stable
    components: main
    signed_by: /usr/share/keyrings/mise-archive-keyring.gpg
    state: present
  become: true

- name: Install mise
  ansible.builtin.apt:
    name: mise
    state: present
    update_cache: true
  become: true
