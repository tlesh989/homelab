---
- name: Remove obsolete GitHub CLI apt repository files (superseded by mise)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/github-cli.sources
    - /etc/apt/sources.list.d/github-cli.list
  become: true

- name: Remove obsolete GitHub CLI apt keyring (superseded by mise)
  ansible.builtin.file:
    path: /usr/share/keyrings/githubcli-archive-keyring.gpg
    state: absent
  become: true

- name: Remove legacy one-line apt list files superseded by deb822 sources
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/nodesource.list
    - /etc/apt/sources.list.d/doppler.list
  become: true

- name: Remove obsolete Node.js and Doppler packages (superseded by mise / no longer needed)
  ansible.builtin.apt:
    name:
      - nodejs
      - doppler
    state: absent
  become: true

- name: Remove obsolete NodeSource and Doppler apt repository files (superseded by mise / no longer needed)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/nodesource.sources
    - /etc/apt/sources.list.d/doppler.sources
  become: true

- name: Remove obsolete NodeSource and Doppler apt keyrings (superseded by mise / no longer needed)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/keyrings/nodesource.gpg
    - /usr/share/keyrings/doppler-archive-keyring.gpg
  become: true

- name: Install curl and gpg
  ansible.builtin.apt:
    name:
      - curl
      - gpg
      - python3-debian
      - locales
    state: present
    update_cache: true
  become: true

- name: Generate en_US.UTF-8 locale
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present
  become: true

- name: Set en_US.UTF-8 as system default locale
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
    mode: "0644"
  loop:
    - { key: LANG, value: en_US.UTF-8 }
    - { key: LC_ALL, value: en_US.UTF-8 }
  loop_control:
    label: "{{ item.key }}"
  become: true

- name: Install Claude Code CLI via native installer # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
    creates: /home/{{ claude_code_user }}/.local/bin/claude
    executable: /bin/bash
  become: true
  become_user: "{{ claude_code_user }}"
  changed_when: true

- name: Check for legacy npm-installed bd (beads) CLI
  ansible.builtin.command:
    cmd: npm list -g --depth=0 @beads/bd
  become: true
  register: bd_npm_check
  changed_when: false
  failed_when: false

- name: Remove legacy npm-installed bd (beads) CLI (superseded by mise)
  ansible.builtin.command:
    cmd: npm uninstall -g @beads/bd
  become: true
  when: bd_npm_check.rc == 0
  changed_when: true

- name: Install git
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true
  become: true

- name: Download mise GPG key (ASCII-armored)
  ansible.builtin.get_url:
    url: https://mise.jdx.dev/gpg-key.pub
    dest: /tmp/mise-gpg-key.pub
    mode: "0644"
    force: true
  become: true
  register: mise_key_download

- name: Dearmor mise GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /usr/share/keyrings/mise-archive-keyring.gpg /tmp/mise-gpg-key.pub
  become: true
  when: mise_key_download.changed
  changed_when: mise_key_download.changed # noqa: no-handler

- name: Add mise apt repository
  ansible.builtin.deb822_repository:
    name: mise
    types: deb
    uris: https://mise.jdx.dev/deb # nocheck
    suites: stable
    components: main
    signed_by: /usr/share/keyrings/mise-archive-keyring.gpg
    state: present
  become: true

- name: Install mise
  ansible.builtin.apt:
    name: mise
    state: present
    update_cache: true
  become: true
