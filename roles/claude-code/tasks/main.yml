---
- name: Configure user
  ansible.builtin.import_tasks: user.yml

- name: Install packages
  ansible.builtin.import_tasks: packages.yml

- name: Configure SSH
  ansible.builtin.import_tasks: ssh.yml

- name: Clone repository
  ansible.builtin.import_tasks: repo.yml

- name: Fetch latest main (for mise.toml refresh only) # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git fetch origin main
    chdir: "{{ claude_code_repo_dest }}"
  become: true
  become_user: "{{ claude_code_user }}"
  changed_when: false

- name: Refresh mise.toml from latest main without touching other local changes # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: git checkout origin/main -- mise.toml
    chdir: "{{ claude_code_repo_dest }}"
  become: true
  become_user: "{{ claude_code_user }}"
  changed_when: false

- name: Install pinned tool versions via mise
  ansible.builtin.command:
    cmd: mise install
    chdir: "{{ claude_code_repo_dest }}"
  become: true
  become_user: "{{ claude_code_user }}"
  register: mise_install_result
  changed_when: "'installed' in mise_install_result.stdout"

- name: Activate mise shims in bash sessions
  ansible.builtin.lineinfile:
    path: /home/{{ claude_code_user }}/{{ item.file }}
    line: "{{ item.line }}"
    create: true
    mode: "0644"
  become: true
  become_user: "{{ claude_code_user }}"
  loop:
    - { file: .bashrc, line: 'eval "$(mise activate bash)"' }
    - { file: .profile, line: 'eval "$(mise activate bash --shims)"' }
  loop_control:
    label: "{{ item.file }}"
