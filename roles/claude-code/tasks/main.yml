---
- name: Install packages
  ansible.builtin.import_tasks: packages.yml

- name: Configure user
  ansible.builtin.import_tasks: user.yml

- name: Configure SSH
  ansible.builtin.import_tasks: ssh.yml

- name: Clone repository
  ansible.builtin.import_tasks: repo.yml

- name: Install pinned tool versions via mise
  ansible.builtin.command:
    cmd: mise install
    chdir: "{{ claude_code_repo_dest }}"
  become: true
  become_user: "{{ claude_code_user }}"
  register: mise_install_result
  changed_when: "'installed' in mise_install_result.stdout"

- name: Activate mise shims in bash sessions
  ansible.builtin.lineinfile:
    path: /home/{{ claude_code_user }}/{{ item }}
    line: eval "$(mise activate bash)"
    create: true
    mode: "0644"
  become: true
  become_user: "{{ claude_code_user }}"
  loop:
    - .bashrc
    - .profile
