# https://github.com/dronenb/ansible-role-proxmox
---
# tasks file for proxmox
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Add proxmoxlib.js path to variable
  ansible.builtin.set_fact:
    proxmox_lib_path: >-
      /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js

- name: Check proxmoxlib.js.bak exists
  ansible.builtin.stat:
    path: "{{ proxmox_lib_path }}.bak"
  register: proxmox_js_bak

- name: Make backup from proxmoxlib.js
  when: not proxmox_js_bak.stat.exists
  ansible.builtin.copy:
    src: "{{ proxmox_lib_path }}"
    dest: "{{ proxmox_lib_path }}.bak"
    remote_src: true
    mode: "644"

- name: Create robust nag removal script
  when: proxmox_remove_nag | bool
  ansible.builtin.copy:
    dest: /usr/local/bin/pve-remove-nag.sh
    mode: "0755"
    content: |
      #!/bin/sh
      WEB_JS=/usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
      if [ -s "$WEB_JS" ] && ! grep -q NoMoreNagging "$WEB_JS"; then
          echo "Patching Web UI nag..."
          sed -i -e "/data\.status/ s/!//" -e "/data\.status/ s/active/NoMoreNagging/" "$WEB_JS"
      fi

      MOBILE_TPL=/usr/share/pve-yew-mobile-gui/index.html.tpl
      MARKER="<!-- MANAGED BLOCK FOR MOBILE NAG -->"
      if [ -f "$MOBILE_TPL" ] && ! grep -q "$MARKER" "$MOBILE_TPL"; then
          echo "Patching Mobile UI nag..."
          printf "%s\n" \
            "$MARKER" \
            "<script>" \
            "  function removeSubscriptionElements() {" \
            "    const dialogs = document.querySelectorAll('dialog.pwt-outer-dialog');" \
            "    dialogs.forEach(dialog => {" \
            "      const text = (dialog.textContent || '').toLowerCase();" \
            "      if (text.includes('subscription')) {" \
            "        dialog.remove();" \
            "      }" \
            "    });" \
            "  }" \
            "  const observer = new MutationObserver(removeSubscriptionElements);" \
            "  observer.observe(document.body, { childList: true, subtree: true });" \
            "  removeSubscriptionElements();" \
            "  setTimeout(() => {observer.disconnect();}, 10000);" \
            "</script>" >> "$MOBILE_TPL"
      fi
  register: proxmox_nag_script

- name: Configure APT Hook for nag removal
  when: proxmox_remove_nag | bool
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/no-nag-script
    content: 'DPkg::Post-Invoke { "/usr/local/bin/pve-remove-nag.sh"; };'
    mode: "0644"

- name: Run nag removal script
  when:
    - proxmox_remove_nag | bool
    - proxmox_nag_script.changed
  ansible.builtin.command: /usr/local/bin/pve-remove-nag.sh
  changed_when: true
  notify: Restart pveproxy

- name: Enable IOMMU (Intel)
  when: >-
    ansible_facts.processor |
      list |
      intersect(['GenuineIntel']) |
      length > 0
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_CMDLINE_LINUX_DEFAULT=.*$"
    line: >-
      GRUB_CMDLINE_LINUX_DEFAULT="quiet mitigations=off intel_iommu=on iommu=pt
      intel_pstate=disable
      systemd.unified_cgroup_hierarchy=1"
    state: present
  notify: Update grub

- name: Enable IOMMU (AMD)
  when: >-
    ansible_facts.processor |
      list |
      intersect(['AuthenticAMD']) |
      length > 0
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_CMDLINE_LINUX_DEFAULT=.*$"
    line: >-
      GRUB_CMDLINE_LINUX_DEFAULT="quiet mitigations=off amd_iommu=on iommu=pt
      kvm.ignore_msrs=1 kvm.report_ignored_msrs=0
      systemd.unified_cgroup_hierarchy=1"
    state: present
  notify: Update grub

- name: Configure AMD CPU power states
  when: >-
    ansible_facts.processor |
      list |
      intersect(['AuthenticAMD']) |
      length > 0
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "^GRUB_CMDLINE_LINUX=.*$"
    line: 'GRUB_CMDLINE_LINUX="processor.max_cstate=1 amd_idle.max_cstate=1"'
    state: present
  notify: Update grub

# No VM uses hostpci passthrough; the host iGPUs feed LXCs via /dev/dri (plex,
# tdarr-node on sturm; i915 SR-IOV on tika/bupu). The old VFIO block blacklisted
# amdgpu and set nomodeset, which removed /dev/dri on the first reboot.
- name: Remove legacy GPU passthrough modprobe config
  ansible.builtin.file:
    path: "/etc/modprobe.d/{{ item }}"
    state: absent
  loop:
    - blacklist.conf
    - vfio.conf
  notify: Update initramfs

# Power saving: nodes idle most of the time. powersave is HWP-managed (good)
# on amd-pstate-epp/intel_pstate, but on acpi-cpufreq (the N100s, which boot
# with intel_pstate=disable from the IOMMU cmdline) it pins minimum frequency,
# so the script picks schedutil there instead.
- name: Install CPU governor script
  ansible.builtin.copy:
    dest: /usr/local/bin/set-cpu-governor.sh
    mode: "0755"
    content: |
      #!/bin/sh
      for p in /sys/devices/system/cpu/cpufreq/policy*; do
        [ -r "$p/scaling_driver" ] || continue
        case "$(cat "$p/scaling_driver")" in
          intel_pstate|amd-pstate-epp) gov=powersave ;;
          *) gov=schedutil ;;
        esac
        echo "$gov" > "$p/scaling_governor"
      done
  notify: Apply CPU governor

- name: Install cpu-governor systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/cpu-governor.service
    mode: "0644"
    content: |
      [Unit]
      Description=Set CPU frequency scaling governor

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/bin/set-cpu-governor.sh

      [Install]
      WantedBy=multi-user.target

- name: Enable cpu-governor service
  ansible.builtin.systemd:
    name: cpu-governor.service
    enabled: true
    state: started
    daemon_reload: true
  # In check mode the unit file above is never written, so systemd can't find it
  when: not ansible_check_mode

- name: Check for Proxmox Cluster configuration
  ansible.builtin.stat:
    path: /etc/pve/corosync.conf
  register: proxmox_cluster_conf

- name: Disable HA Manager services
  when: proxmox_disable_ha | bool
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - pve-ha-lrm
    - pve-ha-crm
  failed_when: false

- name: Disable corosync (Non-clustered nodes only)
  when:
    - proxmox_disable_ha | bool
    - not proxmox_cluster_conf.stat.exists
  ansible.builtin.systemd:
    name: corosync
    state: stopped
    enabled: false
  failed_when: false

- name: Enable High Availability services
  when: not (proxmox_disable_ha | bool)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - pve-ha-lrm
    - pve-ha-crm
    - corosync
  failed_when: false
