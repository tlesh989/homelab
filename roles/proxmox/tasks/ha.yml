---
# ha-manager guest enrollment — cluster-wide config, so run_once throughout.

- name: Check HA enrollment for guests
  ansible.builtin.shell:
    cmd: "set -o pipefail && pvesh get /cluster/ha/resources/{{ item.type }}:{{ item.vmid }} --output-format json"
    executable: /bin/bash
  register: _proxmox_ha_status
  changed_when: false
  failed_when: false
  loop: "{{ proxmox_ha_guests }}"
  loop_control:
    label: "{{ item.type }}:{{ item.vmid }}"
  run_once: true

- name: Enroll guests in Proxmox HA
  ansible.builtin.shell:
    cmd: "set -o pipefail && ha-manager add {{ item.item.type }}:{{ item.item.vmid }} --state started"
    executable: /bin/bash
  loop: "{{ _proxmox_ha_status.results }}"
  loop_control:
    label: "{{ item.item.type }}:{{ item.item.vmid }}"
  when:
    - item.rc != 0
    - (item.stderr | default('') | lower) is search('not found|no such')
  changed_when: true
  run_once: true
  become: true

# NUT shuts every node down at once. The default shutdown_policy 'conditional'
# migrates HA services off a node on poweroff; with all nodes going down the
# migrations fail and services are parked in 'error' across reboots (2026-09-08
# outage). 'freeze' stops them and resumes on the same node after boot.
- name: Check HA shutdown policy
  ansible.builtin.command:
    cmd: pvesh get /cluster/options --output-format json
  register: _proxmox_cluster_options
  changed_when: false
  check_mode: false
  run_once: true
  become: true

- name: Set HA shutdown policy to freeze
  ansible.builtin.command:
    cmd: pvesh set /cluster/options --ha shutdown_policy=freeze
  when: ((_proxmox_cluster_options.stdout | from_json).ha | default({}, true)).shutdown_policy | default('') != 'freeze'
  changed_when: true
  run_once: true
  become: true
