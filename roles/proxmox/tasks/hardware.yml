---
# tasks file for hardware-specific optimizations
- name: Install microcode updates
  ansible.builtin.apt:
    name: "{{ (ansible_facts.processor | list | intersect(['GenuineIntel']) | length > 0) | ternary('intel-microcode', 'amd64-microcode') }}"
    state: present
  when: ansible_facts.processor | list | intersect(['GenuineIntel', 'AuthenticAMD']) | length > 0
  notify: Update initramfs

# ansible_facts.mounts omits ZFS datasets, so check for the loaded module instead.
- name: Check for the ZFS kernel module
  ansible.builtin.stat:
    path: /sys/module/zfs
  register: proxmox_zfs_module

- name: Set ZFS ARC Limit
  when:
    - proxmox_zfs_arc_limit | bool
    - proxmox_zfs_module.stat.exists
  block:
    - name: Calculate automatic ZFS ARC limit
      ansible.builtin.set_fact:
        proxmox_zfs_arc_calculated_max: "{{ (ansible_facts.memtotal_mb >= 30000) | ternary(4294967296, 2147483648) }}"
      when: proxmox_zfs_arc_max | int == 0

    - name: Use manual ZFS ARC limit
      ansible.builtin.set_fact:
        proxmox_zfs_arc_calculated_max: "{{ proxmox_zfs_arc_max }}"
      when: proxmox_zfs_arc_max | int > 0

    - name: Configure ZFS ARC max size
      ansible.builtin.copy:
        dest: /etc/modprobe.d/zfs.conf
        content: "options zfs zfs_arc_max={{ proxmox_zfs_arc_calculated_max }}\n"
        mode: "0644"
      notify: Update initramfs

- name: Sysctl Optimizations
  when: proxmox_sysctl_optimizations | bool
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-proxmox-optimizations.conf
  loop:
    - { name: "vm.swappiness", value: "10" }
    - { name: "fs.file-max", value: "524288" }
    - { name: "net.core.somaxconn", value: "1024" }

- name: Performance Governor for N100
  when:
    - ansible_facts.processor | list | intersect(['GenuineIntel']) | length > 0
    - "'N100' in (ansible_facts.processor_vcpus_model | default(''))"
  ansible.builtin.lineinfile:
    path: /etc/default/cpufrequtils
    line: 'GOVERNOR="performance"'
    create: true
    mode: "0644"
  failed_when: false

# i915 SR-IOV was never used: no guest took a virtual function, and its DKMS
# module only built for the running kernel, which kept nodes pinned to an old
# one. Remove what the old tasks installed; the stock i915 driver stays.
- name: Remove unused i915-sriov-dkms module
  ansible.builtin.shell: |
    set -euo pipefail
    command -v dkms >/dev/null || exit 0
    versions=$(dkms status | awk -F'[/,:]' '/^i915-sriov-dkms/{print $2}' | sort -u)
    for v in $versions; do
      dkms remove "i915-sriov-dkms/$v" --all
      echo removed
    done
  args:
    executable: /bin/bash
  register: proxmox_sriov_remove
  changed_when: "'removed' in proxmox_sriov_remove.stdout"
  notify: Update initramfs

- name: Find i915-sriov-dkms source directories
  ansible.builtin.find:
    paths: /usr/src
    patterns: "i915-sriov-dkms*"
    file_type: directory
  register: proxmox_sriov_src

- name: Remove i915-sriov-dkms sources and module options
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (proxmox_sriov_src.files | map(attribute='path') | list) + ['/etc/modprobe.d/i915.conf'] }}"
  notify: Update initramfs

# Proxmox HA — software watchdog (softdog)

- name: Load softdog kernel module persistently
  ansible.builtin.copy:
    dest: /etc/modules-load.d/softdog.conf
    content: "softdog\n"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Load softdog module immediately
  community.general.modprobe:
    name: softdog
    state: present
  become: true

- name: Configure Proxmox HA watchdog
  ansible.builtin.lineinfile:
    path: /etc/default/pve-ha-manager
    regexp: "^WATCHDOG_MODULE="
    line: "WATCHDOG_MODULE=softdog"
    create: true
    mode: "0644"
  become: true
  notify: Restart pve-ha-lrm
