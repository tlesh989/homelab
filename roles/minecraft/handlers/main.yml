---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: restart minecraft
  ansible.builtin.systemd:
    name: minecraft
    state: restarted
  become: true

- name: restart caddy
  ansible.builtin.service:
    name: caddy
    state: restarted
  become: true
  when: _minecraft_tls_cert.stat.exists
