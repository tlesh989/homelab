---
# renovate: datasource=custom.minecraft-bds depName=minecraft-bds
minecraft_bds_version: "1.26.33.2"
minecraft_bds_download_url: "https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-{{ minecraft_bds_version }}.zip"
minecraft_install_dir: /opt/minecraft/bedrock
minecraft_port: 19132
minecraft_server_name: "Cat's Cafe 2.0"
minecraft_level_name: "Death Valley"
minecraft_level_seed: "1370927827048225416"
minecraft_max_players: 10
minecraft_online_mode: true
minecraft_difficulty: peaceful
minecraft_gamemode: survival
minecraft_level_type: DEFAULT
minecraft_update_weekday: "0"
minecraft_update_hour: "3"
minecraft_update_minute: "0"
# Sourced from MINECRAFT_OPERATOR_XUID env var (injected via Doppler) or
# overridden in group_vars/host_vars. An empty XUID would produce a broken
# permissions.json, so tasks/main.yml asserts this is non-null/non-empty.
minecraft_operator_xuid: "{{ lookup('env', 'MINECRAFT_OPERATOR_XUID') | default(None, true) }}"

# NetherNet clients (iOS 1.26.52+) do TLS on the signaling port, which BDS does not serve.
# When enabled, Caddy terminates TLS on minecraft_tls_port and proxies to BDS, and
# server-udp-ports advertises the UDP range at the current public IP. The cert is
# pushed here by acme.sh on pi-hole (roles/acme) — same pattern as roles/caddy.
minecraft_tls_proxy: false
minecraft_tls_port: 19134
minecraft_udp_ports: "30000-30009"
minecraft_tls_domain: "{{ lookup('env', 'MINECRAFT_SERVER') }}"
minecraft_tls_dir: /etc/caddy/tls
# Must match roles/acme's acme_mc_deploy_remote_user / acme_mc_deploy_remote_tls_dir.
minecraft_deploy_user: acme-deploy
# BDS only accepts an IP literal in server-udp-ports, and ours is dynamic. Resolved at
# deploy time here and at every service start by minecraft-udp-ports.sh.
minecraft_public_ip: "{{ lookup('ansible.builtin.url', 'https://ifconfig.me/ip') }}"
