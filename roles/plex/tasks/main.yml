---
# tasks file for plex — installs Plex inside the LXC
# Media is served via NFS from TrueNAS over the storage network (eth1, 192.168.220.x).

# Plex moved its repo to repo.plex.tv (v2 key); the old downloads.plex.tv repo froze at 1.42.2.
- name: Remove legacy Plex apt repo files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/plex.list
    - /etc/apt/trusted.gpg.d/plex.asc
    - /etc/apt/trusted.gpg.d/plexmediaserver.gpg
  become: true

- name: Install Plex apt signing key
  ansible.builtin.get_url:
    url: https://downloads.plex.tv/plex-keys/PlexSign.v2.key
    dest: /etc/apt/keyrings/plexmediaserver.v2.asc
    mode: "0644"
  become: true

- name: Configure Plex apt repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/plexmediaserver.list
    content: |
      deb [signed-by=/etc/apt/keyrings/plexmediaserver.v2.asc] https://repo.plex.tv/deb/ public main
    mode: "0644"
  become: true

- name: Install NFS client
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true
  become: true

- name: Create NFS mount point
  ansible.builtin.file:
    path: "{{ plex_media_path }}"
    state: directory
    mode: "0755"
  become: true

- name: Mount TrueNAS NFS media share
  ansible.posix.mount:
    path: "{{ plex_media_path }}"
    src: "{{ plex_nfs_server }}:{{ plex_nfs_export }}"
    fstype: nfs
    # Explicit hard mount, standardized across consumers (see homelab-1it).
    opts: rw,noatime,nfsvers=4.2,hard,timeo=600,_netdev
    state: mounted
  become: true

- name: Enable unattended upgrades for Plex apt repo
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-plex
    content: |
      // Append Plex repo to unattended-upgrades (:: syntax extends the list, does not replace)
      Unattended-Upgrade::Origins-Pattern:: "site=repo.plex.tv";
    mode: "0644"
  become: true

- name: Install Plex Media Server
  ansible.builtin.apt:
    name: plexmediaserver
    state: present
    update_cache: true
  become: true

- name: Ensure Plex Media Server is enabled and started
  ansible.builtin.systemd:
    name: plexmediaserver
    enabled: true
    state: started
  become: true

# VAAPI hardware transcoding

- name: Install VAAPI drivers in Plex LXC
  ansible.builtin.apt:
    name:
      - vainfo
      - mesa-va-drivers
    state: present
  become: true

- name: Ensure render group exists
  ansible.builtin.group:
    name: render
    state: present
  become: true

- name: Add plex user to render group
  ansible.builtin.user:
    name: plex
    groups: render
    append: true
  become: true
  notify: Restart Plex
