---
# renovate: datasource=docker depName=ghcr.io/bigboot/autokuma
# RC on purpose: 2.0.0 never reconnects after Uptime Kuma restarts (fixed in
# 2.1.0-rc.1, upstream #157). Move to 2.1.0 stable when it ships.
autokuma_version: "2.1.0-rc.2"

# Persistent storage for AutoKuma's id-to-monitor mapping (required since
# v1.0.0 — without it, every container recreate creates duplicate monitors).
autokuma_data_dir: /opt/autokuma

# Routed through Caddy's HTTPS endpoint (same pattern as every other
# password-authenticated service in this repo, e.g. bookorbit_host) rather
# than a direct http://<ip>:3001 connection, since AUTOKUMA_USERNAME/
# PASSWORD would otherwise cross the LAN in cleartext.
autokuma_kuma_url: "https://uptime-kuma.tlesh.xyz"

# Extra labels on the AutoKuma container, used to define per-host group
# monitors (e.g. kuma.arr.group.name: "Arr Stack"). Groups live here because
# parent_name only resolves against this instance's own database — a group
# must be defined on the same host as the monitors that reference it.
autokuma_labels: {}
