---
# renovate: datasource=docker depName=ghcr.io/bookorbit/bookorbit
bookorbit_app_version: "3.0.0"
# Floating major tag (pgvector track) — not an exact version, no renovate pin.
bookorbit_postgres_version: "pg18"

bookorbit_port: 8091
bookorbit_host: "bookorbit.tlesh.xyz"
bookorbit_data_dir: /opt/bookorbit
bookorbit_timezone: America/Detroit
bookorbit_puid: "1000"
bookorbit_pgid: "1000"

bookorbit_postgres_db: bookorbit
bookorbit_postgres_user: bookorbit

# Bind-mounted read-only into the container below so this trial can't write
# into or corrupt the existing library. qbittorrent (arr host) writes into
# this same NFS folder directly.
bookorbit_books_path: /data/media/books

# NFS mount — shares the same wayreth/data/media export as arr/plex; books/
# is this host's own subfolder within it.
bookorbit_media_path: /data/media
bookorbit_nfs_server: 192.168.220.6
bookorbit_nfs_export: /mnt/wayreth/data/media
bookorbit_nfs_mount_opts: rw,noatime,nfsvers=4.2,hard,timeo=600,_netdev
