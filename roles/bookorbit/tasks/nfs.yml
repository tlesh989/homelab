---
- name: Install NFS client
  ansible.builtin.package:
    name: nfs-common
    state: present
  become: true

- name: Create NFS mount point
  ansible.builtin.file:
    path: "{{ bookorbit_media_path }}"
    state: directory
    mode: "0755"
  become: true

- name: Mount TrueNAS NFS media share
  ansible.posix.mount:
    path: "{{ bookorbit_media_path }}"
    src: "{{ bookorbit_nfs_server }}:{{ bookorbit_nfs_export }}"
    fstype: nfs
    opts: "{{ bookorbit_nfs_mount_opts }}"
    state: mounted
  become: true

- name: Create books library directory
  ansible.builtin.file:
    path: "{{ bookorbit_books_path }}"
    state: directory
    mode: "0755"
    owner: "{{ bookorbit_puid }}"
    group: "{{ bookorbit_pgid }}"
  become: true
