---
- name: Gather package manager facts
  ansible.builtin.setup:
    gather_subset:
      - pkg_mgr

- name: Merge package lists
  ansible.builtin.set_fact:
    _packages_combined: "{{ package_list + package_list_group + package_list_host }}"

- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: "{{ package_update_cache }}"
    cache_valid_time: "{{ package_cache_valid_time }}"
  when: ansible_facts.pkg_mgr == 'apt'

- name: Install packages (apt)
  ansible.builtin.apt:
    name: "{{ item.apt | default(item.name) }}"
    state: "{{ item.state | default(package_state) }}"
  loop: "{{ _packages_combined }}"
  when:
    - ansible_facts.pkg_mgr == 'apt'
    - not (item.apt_ignore | default(false) | bool)

- name: Refresh dnf cache
  ansible.builtin.dnf:
    update_cache: "{{ package_update_cache }}"
  when: ansible_facts.pkg_mgr == 'dnf'

- name: Install packages (dnf)
  ansible.builtin.dnf:
    name: "{{ item.dnf | default(item.name) }}"
    state: "{{ item.state | default(package_state) }}"
  loop: "{{ _packages_combined }}"
  when:
    - ansible_facts.pkg_mgr == 'dnf'
    - not (item.dnf_ignore | default(false) | bool)

# Unattended upgrades leave .debs behind; autoclean alone let 1.3G pile up (homelab-j5vu).
- name: Clean apt package cache weekly
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99periodic-clean
    content: |
      APT::Periodic::CleanInterval "7";
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts.pkg_mgr == 'apt'

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap journal size
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    content: |
      [Journal]
      SystemMaxUse=200M
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald
