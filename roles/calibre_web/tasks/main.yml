---
- name: Mount NFS media share
  ansible.builtin.import_tasks: nfs.yml

- name: Create Calibre-Web config directory
  ansible.builtin.file:
    path: "{{ calibre_web_config_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ calibre_web_puid }}"
    group: "{{ calibre_web_pgid }}"
  become: true

- name: Install Docker Python SDK
  ansible.builtin.package:
    name: python3-docker
    state: present
  become: true

# On upgrades from before processed_books moved to NFS, the old local backups
# would otherwise be silently shadowed (not deleted, just inaccessible) by the
# new nested mount below. Migrate them across first; no-op once already moved.
- name: Install rsync for legacy processed_books migration
  ansible.builtin.package:
    name: rsync
    state: present
  become: true

- name: Check for legacy local processed_books data
  ansible.builtin.stat:
    path: "{{ calibre_web_config_dir }}/processed_books"
  register: calibre_web_legacy_processed_books
  become: true

- name: Migrate legacy local processed_books to NFS # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      rsync -a --remove-source-files
      {{ calibre_web_config_dir }}/processed_books/
      {{ calibre_web_processed_books_path }}/
      && find {{ calibre_web_config_dir }}/processed_books -mindepth 1 -type d -empty -delete
    executable: /bin/bash
    creates: "{{ calibre_web_config_dir }}/.processed_books_migrated"
  register: calibre_web_processed_books_migration
  changed_when: calibre_web_processed_books_migration.rc == 0
  when: calibre_web_legacy_processed_books.stat.exists and calibre_web_legacy_processed_books.stat.isdir
  become: true

- name: Mark legacy processed_books migration complete
  ansible.builtin.file:
    path: "{{ calibre_web_config_dir }}/.processed_books_migrated"
    state: touch
    mode: "0644"
    owner: "{{ calibre_web_puid }}"
    group: "{{ calibre_web_pgid }}"
  when: calibre_web_legacy_processed_books.stat.exists and calibre_web_legacy_processed_books.stat.isdir
  become: true

- name: Deploy Calibre-Web Automated container
  community.docker.docker_container:
    name: calibre-web
    image: "crocodilestick/calibre-web-automated:{{ calibre_web_version }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "{{ calibre_web_port | string }}:8083"
    volumes:
      - "{{ calibre_web_config_dir }}:/config"
      - "{{ calibre_web_books_path }}:/calibre-library"
      - "{{ calibre_web_ingest_path }}:/cwa-book-ingest"
      - "{{ calibre_web_processed_books_path }}:/config/processed_books"
    env:
      PUID: "{{ calibre_web_puid }}"
      PGID: "{{ calibre_web_pgid }}"
      TZ: "{{ calibre_web_timezone }}"
      NETWORK_SHARE_MODE: "{{ calibre_web_network_share_mode | string | lower }}"
  become: true
  when:
    - not ansible_check_mode
    - not (molecule_testing | default(false))

# NETWORK_SHARE_MODE=true skips CWA's own chown, so files it imports into the
# library or writes to processed_books land root-owned and block writes from
# other users on the NFS share.
- name: Deploy ownership-fix script
  ansible.builtin.template:
    src: ownership_fix.sh.j2
    dest: "{{ calibre_web_ownership_fix_script }}"
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Schedule periodic ownership fix for library imports
  ansible.builtin.cron:
    name: "calibre-web library ownership fix"
    minute: "*/15"
    job: >-
      flock -n /run/calibre-web-ownership-fix.lock {{ calibre_web_ownership_fix_script }}
    user: root
  become: true

# imported/fixed_originals/converted are CWA's own per-book backup copies with
# no built-in retention; failed/ is excluded since it's small and useful for
# diagnosing ingest failures.
- name: Deploy backup-retention script
  ansible.builtin.template:
    src: backup_retention.sh.j2
    dest: "{{ calibre_web_backup_retention_script }}"
    mode: "0755"
    owner: root
    group: root
  become: true

# Shares the ownership-fix lock so the two NFS-scanning crons never overlap.
- name: Schedule retention cleanup for processed-book backups
  ansible.builtin.cron:
    name: "calibre-web backup retention cleanup"
    minute: "0"
    hour: "4"
    job: >-
      flock -n /run/calibre-web-ownership-fix.lock {{ calibre_web_backup_retention_script }}
    user: root
  become: true
